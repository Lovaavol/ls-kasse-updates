# Veröffentlicht ein Kassen-Update: Dateien werden auf den Zweig "upload" geschoben,
# dieser Ablauf legt sie in das Release des Kanals (Tag <kanal>/win) und löscht den Zweig wieder.
name: Update veroeffentlichen
on:
  push:
    branches: [upload]
permissions:
  contents: write
jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upload
      - name: Release anlegen bzw. Dateien ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          KANAL=$(cat upload/kanal.txt | tr -d '[:space:]')
          case "$KANAL" in stabil|pilot) ;; *) echo "Unbekannter Kanal: $KANAL"; exit 1;; esac
          TAG="$KANAL/win"
          VERSION=$(grep '^version:' upload/latest.yml | awk '{print $2}')
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title "LS-Kasse $KANAL (Windows)" --notes "Kanal $KANAL für Windows. Die Kassen laden latest.yml und die Setup-Datei aus diesem Release."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber upload/*.exe upload/*.blockmap upload/latest.yml
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "LS-Kasse $VERSION – $KANAL (Windows)"
          echo "Veröffentlicht: $VERSION im Kanal $KANAL"
      - name: Upload-Zweig löschen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/upload"
